services:
  - type: web
    name: titanic-seance
    runtime: python
    plan: free             # TabPFN already ran on Kaggle, so the server only does lookups + Gemma calls.
                           # Free services sleep after 15 idle minutes (~1 min cold start).
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false        # free key from https://aistudio.google.com/apikey
      - key: LLM_BACKEND
        value: gemini     # or "openai" for llama.cpp / Ollama / OpenRouter (set LLM_BASE_URL, LLM_MODEL, LLM_API_KEY)
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
